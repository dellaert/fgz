<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pose and contact factors · fgz</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; color: #233438; background: white; font: 1rem/1.45 system-ui, sans-serif }
  main { max-width: 62rem; margin: auto; padding: clamp(1.25rem, 6vw, 4rem) }
  header small { color: #45695d; font-weight: 650; letter-spacing: .1em; text-transform: uppercase }
  h1 { font-size: clamp(1.8rem, 4.2vw, 3rem); line-height: 1.12; letter-spacing: -.035em; margin: .65rem 0 1rem }
  p { margin: 0; color: #495c60 }
  figure { margin: 2rem 0 0; border-block: 1px solid #d7e1dc; padding: 1.25rem 0 }
  svg { display: block; width: 100%; height: auto }
  figcaption, label { font-size: .875rem }
  figcaption { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; margin-top: 1rem }
  figcaption span::before { content: "▪"; color: var(--color, #243438); margin-right: .4em }
  label { display: inline-flex; align-items: center; gap: .75rem; margin-top: 1.25rem }
  select { padding: .35em .65em; font: inherit; color: inherit; background: white; border: 1px solid #81918d; border-radius: .3em }
</style>
<main>
  <header>
    <small>Factor graphs / Contact initialization</small>
    <h1>A stance contact ties successive poses together.</h1>
    <p>Select a root pose (X) or a foot contact (L, R) to trace its constraints.</p>
  </header>
  <figure aria-label="Illustrative pose and contact factor graph">
    <div id="graph"></div>
    <figcaption>
      <span>Relative motion</span>
      <span style="--color: red">Left-foot observation</span>
      <span style="--color: green">Right-foot observation</span>
    </figcaption>
  </figure>
  <label>Selected variable
    <select><option value="">Show all</option></select>
  </label>
</main>
<!-- inline-script -->
</html>
